<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="background: transparent; border-bottom: none;">
    <h1>NETFLIX</h1>
  </header>
  
  <div class="container">
    <div class="card" style="max-width: 440px; margin: 2rem auto; background: rgba(0, 0, 0, 0.82); border: none;">
      <h2>Entrar</h2>
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="••••••••">
        </div>
        <button type="submit" style="width: 100%; font-size: 1rem;">Entrar</button>
      </form>
      <a href="cadastro.html" class="link-redirect">Novo por aqui? <strong>Assine agora.</strong></a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
